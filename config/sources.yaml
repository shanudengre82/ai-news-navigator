# Open, free sources of AI research and news.
# Add a feed by appending to `rss`; any RSS/Atom URL works.

arxiv:
  enabled: true
  categories: [cs.AI, cs.CL, cs.LG, cs.CV, cs.MA, cs.IR, stat.ML]
  max_results: 800        # newest papers pulled per refresh (arXiv volume is very high)
  page_size: 100

hf_daily_papers:
  enabled: true
  days: 14                # curated, community-upvoted papers from huggingface.co/papers

rss:
  - {name: Hugging Face Blog, url: "https://huggingface.co/blog/feed.xml"}
  - {name: Google Research, url: "https://research.google/blog/rss/"}
  - {name: Google DeepMind, url: "https://deepmind.google/blog/rss.xml"}
  - {name: OpenAI News, url: "https://openai.com/news/rss.xml"}
  - {name: Microsoft Research, url: "https://www.microsoft.com/en-us/research/feed/"}
  - {name: BAIR Blog, url: "https://bair.berkeley.edu/blog/feed.xml"}
  - {name: MIT News AI, url: "https://news.mit.edu/rss/topic/artificial-intelligence2"}
  - {name: The Gradient, url: "https://thegradient.pub/rss/"}
  - {name: Lil'Log, url: "https://lilianweng.github.io/index.xml"}
  - {name: Ahead of AI, url: "https://magazine.sebastianraschka.com/feed"}
  - {name: Simon Willison, url: "https://simonwillison.net/atom/everything/"}
  - {name: NVIDIA Technical Blog, url: "https://developer.nvidia.com/blog/feed"}
  - {name: AWS Machine Learning Blog, url: "https://aws.amazon.com/blogs/machine-learning/feed/"}
  - {name: Import AI, url: "https://jack-clark.net/feed/"}
  - {name: MarkTechPost, url: "https://www.marktechpost.com/feed/"}
  - {name: TechCrunch AI, url: "https://techcrunch.com/category/artificial-intelligence/feed/"}
