# Fetches all sources, embeds new items on CPU and pushes the corpus + FAISS index to the
# HF Dataset repo. The Space (REFRESH_MODE=pull) downloads the new snapshot automatically.
# Needs: repo secret HF_TOKEN (HF write token); optional repo variable DATASET_REPO.
name: Refresh corpus

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours (UTC)
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback window in days"
        default: "30"

concurrency:
  group: corpus-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      DATASET_REPO: ${{ vars.DATASET_REPO || 'shanudengre82/ai-news-corpus' }}
      DATA_DIR: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install huggingface_hub -r requirements.txt

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-models-bge-small-en-v1.5

      - name: Fetch, index and push
        run: |
          set -o pipefail
          python scripts/build_corpus.py --days "${{ inputs.days || '30' }}" --dataset-repo "$DATASET_REPO" \
            2>&1 | tee build.log
          {
            echo "### Corpus refresh → [$DATASET_REPO](https://huggingface.co/datasets/$DATASET_REPO)"
            echo '```'
            sed -n '/^Fetched /,$p' build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
